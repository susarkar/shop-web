<mat-card class="mat-elevation-z8">
    <mat-card-header>
        <mat-toolbar>
            <mat-toolbar-row>
                <span>Category List</span>
                <span class="example-spacer"></span>
                <button mat-raised-button matTooltip="Add New Category"
                    (click)="openAddEditCategory()"><mat-icon>add</mat-icon></button>
            </mat-toolbar-row>
        </mat-toolbar>
    </mat-card-header>
    <mat-card-content>
        <mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

            <ng-container matColumnDef="id">
                <mat-header-cell *matHeaderCellDef mat-sort-header>ID</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.id }}</mat-cell>
            </ng-container>
            <ng-container matColumnDef="name">
                <mat-header-cell *matHeaderCellDef mat-sort-header>Category Name</mat-header-cell>
                <mat-cell *matCellDef="let row">{{ row.name }}</mat-cell>
            </ng-container>



            <ng-container matColumnDef="actions">
                <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
                <mat-cell *matCellDef="let row">
                    <button mat-icon-button (click)="openAddEditCategory(row)"><mat-icon>edit</mat-icon></button>
                    <button mat-icon-button (click)="deleteCategory(row.id)"><mat-icon>delete</mat-icon></button>
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <!-- <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator> -->
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons [pageSize]="pageSize"
            [length]="totalRecords" (page)="onPageChange($event)">
        </mat-paginator>
    </mat-card-content>

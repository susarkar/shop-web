<form [formGroup]="purchaseForm" (ngSubmit)="onSubmit()">
    <mat-card>
        <mat-card-title>{{ data ? 'Edit' : 'Add' }} Purchase</mat-card-title>
        <mat-card-content>
            <div class="row">
                <mat-form-field>
                    <mat-label>Supplier</mat-label>
                    <input type="text" matInput formControlName="supplier" [matAutocomplete]="supplierAuto"
                        (input)="supplierFilter($event)" />
                    <mat-autocomplete #supplierAuto="matAutocomplete" [displayWith]="displayFn">
                        <mat-option *ngFor="let supplier of suppliers()" [value]="supplier">{{ supplier.name
                            }}</mat-option>
                    </mat-autocomplete>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="date" />
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Status</mat-label>
                    <input matInput type="text" formControlName="status" />
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Total Amount</mat-label>
                    <input matInput type="number" formControlName="totalAmount" />
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Tax Amount</mat-label>
                    <input matInput type="number" formControlName="taxAmount" />
                </mat-form-field>
            </div>

            <h3>Purchase Items:</h3>
            <div formArrayName="items">
                <div *ngFor="let ctrl of items.controls; let i = index" [formGroupName]="i" class="item-row">
                    <div class="row">
                        <mat-form-field>
                            <mat-label>Product</mat-label>
                            <input type="text" matInput formControlName="product" [matAutocomplete]="productAuto"
                                (input)="productFilter($event)" />
                            <mat-autocomplete #productAuto="matAutocomplete" [displayWith]="displayFn">
                                <mat-option *ngFor="let product of products()" [value]="product">{{ product.productName
                                    }}</mat-option>
                            </mat-autocomplete>
                        </mat-form-field>

                        <mat-form-field>
                            <mat-label>Quantity</mat-label>
                            <input matInput type="number" formControlName="quantity" (input)="updateItemTotal(i)" />
                        </mat-form-field>

                        <mat-form-field>
                            <mat-label>Price</mat-label>
                            <input matInput type="number" formControlName="price" (input)="updateItemTotal(i)" />
                        </mat-form-field>

                        <mat-form-field>
                            <mat-label>Tax Rate</mat-label>
                            <input matInput type="number" formControlName="taxRate" (input)="updateItemTotal(i)" />
                        </mat-form-field>

                        <mat-form-field>
                            <mat-label>Total</mat-label>
                            <input matInput type="number" formControlName="itemTotal" />
                        </mat-form-field>

                        <button mat-icon-button color="warn" type="button" (click)="removeItem(i)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </div>
            </div>

            <button mat-raised-button color="primary" type="button" (click)="addItem()">Add Item</button>

        </mat-card-content>

        <mat-card-actions align="end">
            <button mat-raised-button color="primary" [disabled]="purchaseForm.invalid" type="submit">Save</button>
            <button mat-button mat-dialog-close>Cancel</button>
        </mat-card-actions>
    </mat-card>
</form>
